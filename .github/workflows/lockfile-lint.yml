name: Lockfile Lint

on:
  # Automatic triggers temporarily disabled to conserve GitHub Actions minutes.
  # Restore by uncommenting the line below.
  # pull_request:
  workflow_dispatch:

jobs:
  lockfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint package-lock.json
        run: npx --yes lockfile-lint --path package-lock.json --type npm --validate-https --allowed-hosts npm --validate-integrity
